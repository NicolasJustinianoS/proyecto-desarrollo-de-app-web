<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador | Joseff Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <nav class="menu contenedor">
      <a href="../index.html" class="logo">JOSEFF STUDIO <span>BY SEAF</span></a>
    </nav>
  </header>

  <main class="auth contenedor">
    <div class="auth-caja">
      <p class="etiqueta">Acceso restringido</p>
      <h1>Administrador</h1>

      <form id="form-admin" novalidate>
        <label for="admin-correo">Correo electrónico</label>
        <input type="email" id="admin-correo" name="correo" autocomplete="email" required>

        <label for="admin-password">Contraseña</label>
        <input type="password" id="admin-password" name="password" autocomplete="current-password" required>

        <p id="mensaje-admin" class="mensaje" role="alert"></p>
        <button type="submit" class="btn">Ingresar</button>
      </form>
    </div>
  </main>

  <script src="../js/admin-login.js"></script>
</body>
</html>

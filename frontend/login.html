<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Joseff Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <nav class="menu contenedor">
      <a href="index.html" class="logo">JOSEFF STUDIO <span>BY SEAF</span></a>
      <ul class="menu-links">
        <li><a href="index.html#servicios">Servicios</a></li>
        <li><a href="index.html#productos">Productos</a></li>
        <li><a href="index.html#barberos">Barberos</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="reservar.html" class="btn">Reservar</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth contenedor">
    <div class="auth-caja">
      <p class="etiqueta">Tu cuenta</p>
      <h1>Bienvenido</h1>

      <div class="pestanas">
        <button type="button" id="tab-login" class="pestana activa">Ingresar</button>
        <button type="button" id="tab-registro" class="pestana">Crear cuenta</button>
      </div>

      <!-- Formulario de ingreso -->
      <form id="form-login" novalidate>
        <label for="login-correo">Correo electrónico</label>
        <input type="email" id="login-correo" name="correo" autocomplete="email" required>

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <p id="mensaje-login" class="mensaje" role="alert"></p>
        <button type="submit" class="btn">Ingresar</button>
      </form>

      <!-- Formulario de registro -->
      <form id="form-registro" class="oculto" novalidate>
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" name="nombre" autocomplete="given-name" required>

        <label for="reg-apellido">Apellido</label>
        <input type="text" id="reg-apellido" name="apellido" autocomplete="family-name" required>

        <label for="reg-correo">Correo electrónico</label>
        <input type="email" id="reg-correo" name="correo" autocomplete="email" required>

        <label for="reg-telefono">Teléfono (8 dígitos)</label>
        <input type="tel" id="reg-telefono" name="telefono" autocomplete="tel" required>

        <label for="reg-password">Contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="reg-password" name="password" autocomplete="new-password" required>

        <label for="reg-password2">Repite la contraseña</label>
        <input type="password" id="reg-password2" name="password2" autocomplete="new-password" required>

        <p id="mensaje-registro" class="mensaje" role="alert"></p>
        <button type="submit" class="btn">Crear cuenta</button>
      </form>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>Quinto anillo, entre Alemana y Banzer · Lun a Sáb, 9:00 a 19:00</p>
      <p>WhatsApp +591 75033791 · Instagram @joseff_studio</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
